[package]
name = "blur-and-save"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "BSD-3-Clause"
description = "An offline desktop app for blurring faces in photos"

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.15.4"
tempfile = "3.23"
tract-onnx = "0.22.1"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
wgpu = { version = "25", default-features = false, features = ["dx12"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = "debuginfo"
