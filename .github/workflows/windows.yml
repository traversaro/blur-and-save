name: Windows build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          locked: true

      - name: Test and build with Pixi
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found.' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          pixi run --locked rustc --version
          pixi run --locked cargo fmt --check
          pixi run --locked test
          pixi run --locked build

          $imports = dumpbin /dependents target\release\blur-and-save.exe | Out-String
          Write-Host $imports
          if ($imports -match '(?im)^\s*(?:VCRUNTIME|MSVCP|MSVCR|VCOMP)\w*\.dll\s*$') {
            throw 'The executable requires a separately installed Visual C++ runtime.'
          }

      - name: Test standalone executable with outbound traffic blocked
        shell: pwsh
        run: |
          $sandbox = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\blur-and-save-smoke"
          $exe = Join-Path $sandbox.FullName 'blur-and-save.exe'
          $result = Join-Path $sandbox.FullName 'blurred.png'
          Copy-Item 'target\release\blur-and-save.exe' $exe
          Copy-Item 'tests\fixtures\astronaut.jpg' $sandbox.FullName
          if ((Get-Item $exe).VersionInfo.ProductName -ne 'Blur & Save') {
            throw 'The Windows application resources are missing.'
          }
          $disabled = @(Get-NetFirewallProfile | Where-Object { -not $_.Enabled } | Select-Object -ExpandProperty Name)
          try {
            if ($disabled.Count -gt 0) {
              Set-NetFirewallProfile -Profile $disabled -Enabled True
            }
            New-NetFirewallRule -Name 'BlurAndSaveOfflineSmoke' -DisplayName 'Blur & Save offline smoke test' -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
            $process = Start-Process -FilePath $exe -WorkingDirectory $sandbox.FullName -ArgumentList '--offline-smoke-test astronaut.jpg blurred.png' -PassThru -Wait
            if ($process.ExitCode -ne 0 -or !(Test-Path $result)) {
              throw "Standalone offline test failed (exit code $($process.ExitCode))."
            }
          } finally {
            Remove-NetFirewallRule -Name 'BlurAndSaveOfflineSmoke' -ErrorAction SilentlyContinue
            if ($disabled.Count -gt 0) {
              Set-NetFirewallProfile -Profile $disabled -Enabled False
            }
          }

      - name: Collect redistribution notices
        shell: pwsh
        run: python .github/collect_notices.py

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $project = pixi run --locked cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $version = ($project.packages | Where-Object { $_.name -eq 'blur-and-save' }).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows build for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          if-no-files-found: error
          path: |
            target/release/blur-and-save.exe
            target/release/THIRD-PARTY-NOTICES.txt

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    environment: windows-signing
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check release status and signing configuration
        id: preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false) | .tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check published releases.' }
          if ($releases -contains "v$env:VERSION") {
            Write-Host "v$env:VERSION is already published."
            exit 0
          }
          $missing = @(
            'ESIGNER_USERNAME', 'ESIGNER_PASSWORD', 'ESIGNER_CREDENTIAL_ID', 'ESIGNER_TOTP_SECRET',
            'WINDOWS_SIGNER_THUMBPRINT'
          ) | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Configure the windows-signing environment before publishing. Missing: $($missing -join ', ')."
          }
          if (($env:WINDOWS_SIGNER_THUMBPRINT -replace '\s', '') -notmatch '^[0-9a-f]{40}$') {
            throw 'WINDOWS_SIGNER_THUMBPRINT must be the 40-character leaf certificate thumbprint.'
          }
          'publish=true' >> $env:GITHUB_OUTPUT

      - name: Download Windows build
        if: steps.preflight.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-build
          path: release

      - name: Sign the Windows executable with SSL.com eSigner
        if: steps.preflight.outputs.publish == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          file_path: release/blur-and-save.exe
          override: true

      - name: Verify the Authenticode signature and timestamp
        if: steps.preflight.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          $exe = 'release/blur-and-save.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignatureType -ne 'Authenticode') {
            throw "Windows did not validate the embedded Authenticode signature. Status $($signature.Status)."
          }
          if (!$signature.TimeStamperCertificate) {
            throw 'The Authenticode signature has no trusted timestamp.'
          }
          if ($signature.SignerCertificate.Thumbprint -ne ($env:WINDOWS_SIGNER_THUMBPRINT -replace '\s', '')) {
            throw 'The signer certificate differs from the configured certificate.'
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe

      - name: Publish signed executable
        if: steps.preflight.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) {
            throw 'Run the release from the current main branch.'
          }

          gh release create $tag release/blur-and-save.exe release/THIRD-PARTY-NOTICES.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Blur & Save $env:VERSION" --notes 'Download the signed blur-and-save.exe for Windows 10 or 11 (64-bit) and double-click it. Open a photo, check the detected faces, and save a copy. The app works offline.'
